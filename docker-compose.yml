# Local stack. `docker compose up -d --wait` starts PostgreSQL and the app;
# `docker compose --profile obs up -d` adds Prometheus and Grafana.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: playword
      POSTGRES_PASSWORD: playword
      POSTGRES_DB: playword
    ports: ["127.0.0.1:55432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playword"]
      interval: 2s
      retries: 30

  migrate:
    build: .
    entrypoint: ["/app/playword-cli", "migrate", "up"]
    environment:
      DATABASE_URL: postgres://playword:playword@db:5432/playword?sslmode=disable
    depends_on:
      db: {condition: service_healthy}
    profiles: [app]

  app:
    build: .
    environment:
      DATABASE_URL: postgres://playword:playword@db:5432/playword?sslmode=disable
      PLAYWORD_IP_SALT: ${PLAYWORD_IP_SALT:-change-me-in-production}
      PLAYWORD_ADMIN_TOKEN: ${PLAYWORD_ADMIN_TOKEN:-}
      PLAYWORD_INSECURE_COOKIES: "true"   # plain HTTP on localhost; drop behind TLS
      PLAYWORD_INGEST_SCHEDULE: ${PLAYWORD_INGEST_SCHEDULE:-}
      PLAYWORD_PUBLIC_URL: ${PLAYWORD_PUBLIC_URL:-http://localhost:8020}
      PLAYWORD_GOOGLE_CLIENT_ID: ${PLAYWORD_GOOGLE_CLIENT_ID:-}
      PLAYWORD_GOOGLE_CLIENT_SECRET: ${PLAYWORD_GOOGLE_CLIENT_SECRET:-}
    ports: ["127.0.0.1:${PLAYWORD_PORT:-8020}:8020", "127.0.0.1:${PLAYWORD_METRICS_PORT:-9090}:9090"]
    depends_on:
      db: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "/app/playword-cli", "healthcheck", "http://127.0.0.1:8020/readyz"]
      interval: 5s
      retries: 60
    profiles: [app]

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes: [./.deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["127.0.0.1:9091:9090"]
    profiles: [obs]

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./.deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./.deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3000:3000"]
    profiles: [obs]

volumes:
  pgdata:
